          description: ''
components:
  schemas:
    AstronomyShow:
      type: object
      description: Serializer for astronomy shows.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
      required:
      - id
      - title
    PatchedAstronomyShow:
      type: object
      description: Serializer for astronomy shows.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
    PatchedPlanetariumDome:
      type: object
      description: Serializer for planetarium domes.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        rows:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        seats_in_row:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
    PatchedShowSession:
      type: object
      description: Serializer for show sessions with validation to prevent scheduling
        conflicts.
      properties:
        id:
          type: integer
          readOnly: true
        show_time:
          type: string
          format: date-time
        duration:
          type: string
        ticket_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        astronomy_show:
          type: integer
        planetarium_dome:
          type: integer
    PatchedShowTheme:
      type: object
      description: Serializer for show themes.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
    PatchedUser:
      type: object
      description: Serializer for user data.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 30
        last_name:
          type: string
          maxLength: 30
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
    Payment:
      type: object
      description: Serializer for payment details.
      properties:
        id:
          type: integer
          readOnly: true
        reservation:
          type: integer
        session_url:
          type: string
          format: uri
          readOnly: true
        session_id:
          type: string
          readOnly: true
        amount_of_money:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
      required:
      - amount_of_money
      - id
      - reservation
      - session_id
      - session_url
      - status
    PaymentStatusEnum:
      enum:
      - 0
      - 1
      type: integer
      description: |-
        * `0` - Pending
        * `1` - Paid
    PlanetariumDome:
      type: object
      description: Serializer for planetarium domes.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        rows:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
