services:
  nginx:
    container_name: planetarium-nginx
    restart: always
    image: nginx:1.25.2
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/backend/django_static
      - media_volume:/app/backend/media
    networks:
      - planetarium-network
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: "postgres:16.0"
    container_name: postgres-planetarium
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_planetarium_data:/var/lib/postgresql/data/
    networks:
      - planetarium-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-planetarium
    ports:
      - "3333:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_planetarium_data:/var/lib/pgadmin
    networks:
      - planetarium-network

  backend:
    restart: always
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    entrypoint: /app/docker/backend/server-entrypoint.sh
    container_name: planetarium-backend
    working_dir: /app/backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/usr/app/backend
      - static_volume:/app/backend/django_static
      - media_volume:/app/backend/media
    networks:
      - planetarium-network
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8000/api/health/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    container_name: planetarium-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
#    environment:
#      - PYTHONPATH=/app/backend/
    entrypoint: /app/docker/backend/worker-entrypoint.sh
#    working_dir: /app/backend
    volumes:
      - ./src:/usr/app/backend
      - static_volume:/app/backend/django_static
      - media_volume:/app/backend/media
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    networks:
      - planetarium-network

  redis:
    container_name: planetarium-redis
    restart: unless-stopped
    image: redis:7.2.1
    ports:
      - "6379:6379"
    networks:
      - planetarium-network

volumes:
  static_volume:
  media_volume:
  pgadmin_planetarium_data:
  postgres_planetarium_data:
    driver: local

networks:
  planetarium-network:
    driver: bridge
